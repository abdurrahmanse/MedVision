name: Keep API Awake

on:
  schedule:
    # Runs every 10 minutes to prevent the Render free tier from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API
        run: curl -s https://medvision-api-fa3t.onrender.com/api/v1/health
