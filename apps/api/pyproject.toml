[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abdur Rahman", email = "abdurrahmansoftw@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "boto3>=1.43.89",
    "fastapi>=0.141.1",
    "greenlet>=3.5.5",
    "gunicorn>=26.2.0",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.15.0",
    "python-json-logger>=4.2.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "rich>=15.0.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.52",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
