services:
  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  db:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    container_name: medvision_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-medvision}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis Cache ───────────────────────────────────────────────────────────
  cache:
    image: public.ecr.aws/docker/library/redis:7-alpine
    container_name: medvision_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ───────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: medvision_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - ./ml/models:/app/ml/models
      - ./storage:/storage
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  # ─── Next.js Frontend ──────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: medvision_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - INTERNAL_API_URL=http://api:8000
    depends_on:
      - api

  # ─── ML / Data Science Environment ────────────────────────────────────────
  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: medvision_ml
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./ml:/app
      - ./storage:/storage
    command: tail -f /dev/null
    depends_on:
      db:
        condition: service_healthy

  # ─── Fumadocs Documentation ────────────────────────────────────────────────
  docs:
    build:
      context: ./apps/docs
      dockerfile: Dockerfile
    container_name: medvision_docs
    restart: unless-stopped
    ports:
      - "3001:3000"

volumes:
  postgres_data:
  redis_data:
